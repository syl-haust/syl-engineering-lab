services:
  # 如果你本机已经有 MySQL（默认 3306 端口），keep-mysql 可以跳过：
  #   docker compose up -d redis rabbitmq
  # 然后手工执行 sql/init.sql 到你本地的 MySQL 即可。
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    ports:
      # 用 3307 映射，避免和宿主机已有 MySQL 抢 3306
      - "3307:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - lab-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - lab-redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # 管理台 http://localhost:15672
    volumes:
      - lab-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nacos 单机模式：配置中心 + 服务注册
  # 控制台: http://localhost:8848/nacos  账号密码 nacos/nacos
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: lab-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"    # 控制台 / HTTP API
      - "9848:9848"    # gRPC（客户端 2.x 必需）
    volumes:
      - lab-nacos-data:/home/nacos/data
      - lab-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # 可选：把应用也放进容器
  # app:
  #   build: .
  #   container_name: lab-app
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #     rabbitmq:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/syl_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  #     SPRING_DATA_REDIS_HOST: redis
  #     SPRING_RABBITMQ_HOST: rabbitmq
  #   ports:
  #     - "8080:8080"

volumes:
  lab-mysql-data:
  lab-redis-data:
  lab-rabbitmq-data:
  lab-nacos-data:
  lab-nacos-logs: